name: Reusable recreate staging from main workflow

on:
  workflow_call:
    inputs:
      target_repos:
        description: 'Target repositories to recreate staging in (comma-separated owner/repo)'
        required: false
        default: 'DEEPX-AI/dx_rt,DEEPX-AI/dx_app,DEEPX-AI/dx_stream,DEEPX-AI/dx_rt_npu_linux_driver,DEEPX-AI/dx_fw,DEEPX-AI/dx-compiler,DEEPX-AI/dx-modelzoo,DEEPX-AI/dx-runtime,DEEPX-AI/dx-all-suite'
        type: string
      base_branch:
        description: 'Branch to recreate staging from'
        required: false
        default: 'main'
        type: string
      staging_branch:
        description: 'Staging branch name to reset'
        required: false
        default: 'staging'
        type: string
    secrets:
      token:
        description: 'Token for Read & Write'
        required: true

permissions: write-all

jobs:
  setup:
    runs-on:
      - self-hosted
      - sdk
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      count: ${{ steps.parse.outputs.count }}
    steps:
      - name: Validate branch names
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          STAGING_BRANCH: ${{ inputs.staging_branch }}
        run: |
          for b in "$BASE_BRANCH" "$STAGING_BRANCH"; do
            if [[ ! "$b" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
              echo "::error::Invalid branch name: $b"
              exit 1
            fi
          done

      - name: Parse and validate target repos
        id: parse
        run: |
          IFS=',' read -ra REPOS <<< "${{ inputs.target_repos }}"
          repos_json="["
          count=0

          for repo in "${REPOS[@]}"; do
            repo=$(echo "$repo" | xargs)
            if [[ $repo =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
              [[ $count -gt 0 ]] && repos_json+=","
              repos_json+="\"$repo\""
              count=$((count + 1))
              echo "Valid repository: $repo"
            else
              echo "::warning::Invalid repository format, skipping: $repo"
            fi
          done

          repos_json+="]"
          echo "matrix=$repos_json" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Parsed $count valid repositories"

  recreate:
    needs: setup
    if: needs.setup.outputs.count != '0'
    runs-on:
      - self-hosted
      - sdk
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Recreate ${{ inputs.staging_branch }} from ${{ inputs.base_branch }} (${{ matrix.repo }})
        id: recreate
        env:
          TOKEN: ${{ secrets.token }}
          REPO_FULL: ${{ matrix.repo }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          STAGING_BRANCH: ${{ inputs.staging_branch }}
        run: |
          set -euo pipefail

          REMOTE_URL="https://x-access-token:${TOKEN}@github.com/${REPO_FULL}.git"

          BASE_SHA=$(git ls-remote --heads "$REMOTE_URL" "$BASE_BRANCH" | awk '{print $1}')
          if [[ -z "$BASE_SHA" ]]; then
            echo "::error::Base branch ${BASE_BRANCH} not found in ${REPO_FULL}."
            exit 1
          fi

          STAGING_SHA=$(git ls-remote --heads "$REMOTE_URL" "$STAGING_BRANCH" | awk '{print $1}')
          if [[ "$STAGING_SHA" == "$BASE_SHA" ]]; then
            echo "::notice::${STAGING_BRANCH} already at ${BASE_SHA} for ${REPO_FULL}. Skipping."
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT

          echo "Recreating ${STAGING_BRANCH} from ${BASE_BRANCH} (${BASE_SHA}) in ${REPO_FULL}..."
          git clone --branch "$BASE_BRANCH" --single-branch "$REMOTE_URL" "$WORKDIR"
          cd "$WORKDIR"
          # Reset staging to exactly base (force: staging has diverged with dev commits).
          git push --force origin "HEAD:refs/heads/${STAGING_BRANCH}"

          echo "status=recreated" >> "$GITHUB_OUTPUT"
          echo "Recreated ${REPO_FULL}:${STAGING_BRANCH} at ${BASE_SHA}"

      - name: Write job summary
        if: always()
        run: |
          echo "## ${{ matrix.repo }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Operation:** recreate \`${{ inputs.staging_branch }}\` from \`${{ inputs.base_branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Result:** ${{ steps.recreate.outputs.status || 'failed' }}" >> "$GITHUB_STEP_SUMMARY"
